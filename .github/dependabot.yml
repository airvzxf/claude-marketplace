version: 2
updates:
  # The actions the workflows pin by SHA. The Claude Code version in ci.yml is
  # an npm global install that Dependabot does not follow: bump it by hand.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["actions/*", "github/*"]
      third-party:
        patterns: ["*"]
        exclude-patterns: ["actions/*", "github/*"]
    commit-message:
      prefix: "ci"
    labels: ["dependencies", "ci"]
